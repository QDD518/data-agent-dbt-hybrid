metrics:
  # ── Revenue Metrics ──
  - name: total_revenue
    description: "Total net revenue across all orders (after discounts). The primary revenue KPI."
    label: "Total Revenue"
    type: simple
    type_params:
      measure: revenue
    filter: |
      status = 'Completed'

  - name: gross_revenue
    description: "Total gross revenue before discounts"
    label: "Gross Revenue"
    type: simple
    type_params:
      measure: gross_revenue
    filter: |
      status = 'Completed'

  - name: daily_revenue
    description: "Daily revenue over time — use for trend charts"
    label: "Daily Revenue"
    type: simple
    type_params:
      measure: revenue
    filter: |
      status = 'Completed'
    time_granularity: day

  - name: weekly_revenue
    description: "Weekly revenue over time"
    label: "Weekly Revenue"
    type: simple
    type_params:
      measure: revenue
    filter: |
      status = 'Completed'
    time_granularity: week

  - name: monthly_revenue
    description: "Monthly revenue — use for month-over-month comparison"
    label: "Monthly Revenue"
    type: simple
    type_params:
      measure: revenue
    filter: |
      status = 'Completed'
    time_granularity: month

  # ── Order Metrics ──
  - name: total_orders
    description: "Total number of distinct orders"
    label: "Order Count"
    type: simple
    type_params:
      measure: order_count
    filter: |
      status = 'Completed'

  - name: daily_orders
    description: "Daily order count"
    label: "Daily Orders"
    type: simple
    type_params:
      measure: order_count
    filter: |
      status = 'Completed'
    time_granularity: day

  # ── Customer Metrics ──
  - name: customer_count
    description: "Number of distinct customers who placed orders"
    label: "Active Customers"
    type: simple
    type_params:
      measure: unique_customers

  - name: total_customers
    description: "Total number of registered customers"
    label: "Registered Customers"
    type: simple
    type_params:
      measure: total_customers

  # ── KPI Metrics ──
  - name: avg_order_value
    description: "Average order value (AOV) — total revenue / number of orders"
    label: "AOV"
    type: simple
    type_params:
      measure: avg_order_value
    filter: |
      status = 'Completed'

  - name: avg_discount_rate
    description: "Average discount percentage across orders"
    label: "Avg Discount %"
    type: simple
    type_params:
      measure: avg_discount
    filter: |
      status = 'Completed'

  - name: total_units_sold
    description: "Total quantity of units sold"
    label: "Units Sold"
    type: simple
    type_params:
      measure: total_quantity
    filter: |
      status = 'Completed'

  # ── Inventory Metrics ──
  - name: total_stock_quantity
    description: "Total units in stock across all warehouses"
    label: "Total Stock"
    type: simple
    type_params:
      measure: total_stock_quantity

  - name: total_inventory_value
    description: "Total monetary value of current inventory"
    label: "Inventory Value"
    type: simple
    type_params:
      measure: total_inventory_value

  - name: reorder_alert_count
    description: "Number of inventory items requiring reorder"
    label: "Reorder Alerts"
    type: simple
    type_params:
      measure: reorder_required_count

  - name: out_of_stock_count
    description: "Number of completely out-of-stock items"
    label: "Out of Stock"
    type: simple
    type_params:
      measure: out_of_stock_count

  # ── Marketing Metrics ──
  - name: total_ad_spend
    description: "Total advertising spend across all campaigns"
    label: "Ad Spend"
    type: simple
    type_params:
      measure: total_ad_spend

  - name: total_campaign_revenue
    description: "Total revenue generated from marketing campaigns"
    label: "Campaign Revenue"
    type: simple
    type_params:
      measure: total_campaign_revenue

  - name: campaign_roi
    description: "Campaign ROI (net profit / ad spend)"
    label: "Campaign ROI"
    type: simple
    type_params:
      measure: total_campaign_profit

  - name: total_impressions
    description: "Total ad impressions across all campaigns"
    label: "Impressions"
    type: simple
    type_params:
      measure: total_impressions

  - name: total_conversions
    description: "Total conversions attributed to campaigns"
    label: "Conversions"
    type: simple
    type_params:
      measure: total_conversions

  - name: average_ctr
    description: "Average click-through rate across campaigns"
    label: "Avg CTR"
    type: simple
    type_params:
      measure: avg_ctr

  - name: average_roas
    description: "Average Return on Ad Spend"
    label: "Avg ROAS"
    type: simple
    type_params:
      measure: avg_roas

  - name: average_cpa
    description: "Average Cost per Acquisition"
    label: "Avg CPA"
    type: simple
    type_params:
      measure: avg_cpa

  # ── Customer RFM Metrics ──
  - name: total_rfm_customers
    description: "Total customers with RFM scores"
    label: "RFM Customers"
    type: simple
    type_params:
      measure: rfm_customer_count

  - name: avg_customer_lifetime_value
    description: "Average total spend per customer (Monetary)"
    label: "Avg Customer LTV"
    type: simple
    type_params:
      measure: avg_monetary

  - name: avg_purchase_frequency
    description: "Average number of orders per customer"
    label: "Avg Frequency"
    type: simple
    type_params:
      measure: avg_frequency

  # ── Cohort Retention Metric ──
  - name: customer_count_by_segment
    description: "Number of customers in each RFM segment"
    label: "Customers by Segment"
    type: simple
    type_params:
      measure: rfm_customer_count
