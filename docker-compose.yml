services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbi-postgres
    environment:
      POSTGRES_DB: chatbi_demo
      POSTGRES_USER: chatbi
      POSTGRES_PASSWORD: chatbi123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbi -d chatbi_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatbi-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chatbi-backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-your-key-here}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chatbi_demo
      POSTGRES_USER: chatbi
      POSTGRES_PASSWORD: chatbi123
      POSTGRES_SCHEMA: analytics
      DBT_PROJECT_DIR: ./dbt_project
      DBT_PROFILES_DIR: ./dbt_project
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    volumes:
      - dbt_target:/app/dbt_project/target
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbi-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chatbi-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - chatbi-net
    restart: unless-stopped

  # Optional: run dbt models after postgres is ready
  dbt-setup:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chatbi-dbt-setup
    command: >
      sh -c "
        cd dbt_project &&
        dbt seed &&
        dbt run &&
        dbt parse
      "
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chatbi_demo
      POSTGRES_USER: chatbi
      POSTGRES_PASSWORD: chatbi123
      POSTGRES_SCHEMA: analytics
      DBT_PROJECT_DIR: ./dbt_project
      DBT_PROFILES_DIR: ./dbt_project
    volumes:
      - dbt_target:/app/dbt_project/target
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbi-net
    profiles:
      - setup  # Only runs with: docker-compose --profile setup up

volumes:
  postgres_data:
  dbt_target:

networks:
  chatbi-net:
    driver: bridge
