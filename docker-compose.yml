services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbi-postgres
    environment:
      POSTGRES_DB: chatbi_demo
      POSTGRES_USER: chatbi
      POSTGRES_PASSWORD: chatbi123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbi -d chatbi_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
